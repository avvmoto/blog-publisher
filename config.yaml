# プラットフォームごとの URL・セレクタ等。機密情報（ID/パスワード）は .env に置く。

chichipui:
  upload_url: "https://www.chichi-pui.com/posts/upload/"
  default_age_limit: 1   # 1=全年齢, 4=R-15, 2=R-18, 3=R-18G
  default_taste: 1       # 1=イラスト, 2=フォト, 99=未分類

note:
  login_url: "https://note.com/login"
  editor_url: "https://note.com/notes/new"  # → editor.note.com/notes/{id}/edit/ へリダイレクト
  selectors:
    # ログインフォーム（DOM 実測済み 2026-06-01）
    email_input: "#email"
    password_input: "#password"
    login_button: 'button:has-text("ログイン")'
    # エディター（DOM 実測済み 2026-06-01）
    title_input: 'textarea[placeholder="記事タイトル"]'
    body_input: '[role="textbox"].ProseMirror'
    # ヘッダー画像ボタン（DOM 実測済み 2026-06-01）
    thumbnail_button: 'button[aria-label="画像を追加"]'
    # 公開フロー（DOM 実測済み 2026-06-01 / モーダル内タグ・投稿ボタンは未実測）
    publish_button: 'button:has-text("公開に進む")'
    tag_input: 'input[placeholder="ハッシュタグを追加する"]'  # DOM実測済み
    post_button: 'button:has-text("投稿する")'
