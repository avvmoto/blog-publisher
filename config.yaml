# プラットフォームごとの URL・セレクタ等。機密情報（ID/パスワード）は .env に置く。
# 値は note 実装フェーズで playwright codegen の結果を見て確定する（現状は枠）。

chichipui:
  upload_url: "https://www.chichi-pui.com/posts/upload/"
  default_age_limit: 1   # 1=全年齢, 4=R-15, 2=R-18, 3=R-18G
  default_taste: 1       # 1=イラスト, 2=フォト, 99=未分類

note:
  login_url: "https://note.com/login"
  editor_url: "https://note.com/notes/new"
  selectors:
    # ログインフォーム（デフォルトは note.com の標準 HTML name 属性）
    email_input: 'input[name="email"]'
    password_input: 'input[name="password"]'
    login_button: 'button[type="submit"]'
    # エディター: タイトルと本文（codegen で確認・更新推奨）
    title_input: '[data-placeholder="タイトル"]'
    body_input: ".ProseMirror"
    # インライン画像のアップロード用 file input
    image_upload_input: 'input[type="file"][accept*="image"]'
    # ヘッダー画像ボタン（公開設定モーダル内）
    thumbnail_button: 'button[aria-label*="ヘッダー"]'
    # 公開フロー
    publish_button: 'button:has-text("公開設定")'
    tag_input: 'input[placeholder*="タグ"]'
    post_button: 'button:has-text("投稿する")'
