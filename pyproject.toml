[project]
name = "blog-publisher"
version = "0.1.0"
description = "Automate blog posting (login, import, image upload, thumbnail) with Playwright."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "playwright-stealth>=2.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog_publisher"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
