[project]
name = "blog-publisher"
version = "0.1.0"
description = "Automate blog posting (login, import, image upload, thumbnail) with Playwright."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog_publisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
